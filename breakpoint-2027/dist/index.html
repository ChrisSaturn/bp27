.ticket-confetti i:nth-child(3n) { width: .53rem; height: .36rem; }
@keyframes ticket-mesh-out { 0%, 62% { opacity: 1; } to { opacity: 0; } }
@keyframes ticket-face-in { 0%, 62% { opacity: 0; } to { opacity: 1; } }
@keyframes reveal-backdrop {
  0%, 11% { opacity: 0; }
  48% { opacity: .88; }
  to { opacity: 1; }
}
.close-reveal {
  position: absolute;
  top: 0;
  right: 4px;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid #dabaff50;
  border-radius: 50%;
  color: #fff;
  background: #210f38;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
}
.close-reveal:hover, .close-reveal:focus-visible { background: #412661; }
.is-launching .close-reveal:not(:focus-visible) { animation: reveal-close 360ms 220ms both; }
@keyframes reveal-close { from { opacity: 0; } }
.ticket-pull {
  position: absolute;
  top: 12px;
  left: 50%;
  margin: 0;
  transform: translateX(-50%);
  color: var(--pull-color, #e7d6ff);
  font-size: clamp(.875rem, 2.8vw, 1rem);
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  white-space: nowrap;
}
.is-launching .ticket-pull { visibility: hidden; }
.is-near-common .ticket-pull { visibility: visible; }
@media (prefers-reduced-motion: no-preference) {
  .is-landed .ticket-flight::before {
    content: "";
    position: absolute;
    inset: -16%;
    background: radial-gradient(ellipse, #ffd08365 22%, #e38b9f31 51%, transparent 73%);
    pointer-events: none;
    animation: legendary-glow 440ms ease-out both;
  }
  .is-landed .ticket-pull { animation: legendary-pull 240ms cubic-bezier(.15,.72,.28,1) both; }
  .is-landed .ticket-flight > .ticket,
  .is-landed .ticket-result .ticket-price { animation: legendary-impact 330ms both; }
  .is-landed .ticket-confetti i {
    animation: legendary-confetti var(--confetti-duration) cubic-bezier(.14,.72,.34,1) var(--confetti-delay) both;
  }
}
@keyframes legendary-glow {
  from { transform: scale(.87); opacity: .82; }
  to { transform: scale(1.1); opacity: 0; }
}
@keyframes legendary-pull {
  from { transform: translateX(-50%) scale(.9); opacity: 0; }
  to { transform: translateX(-50%) scale(1); opacity: 1; }
}
@keyframes legendary-impact {
  from { scale: var(--legendary-entry-scale); animation-timing-function: cubic-bezier(.24,.64,.32,1); }
  49% { scale: 1.07; animation-timing-function: ease-out; }
  to { scale: 1; }
}
@keyframes legendary-confetti {
  from { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(.65); }
  15% { opacity: 1; }
  68% { opacity: 1; transform: translate(var(--confetti-x), var(--confetti-y)) rotate(var(--confetti-spin)); }
  to {
    opacity: 0;
    transform: translate(calc(var(--confetti-x) * 1.18), calc(var(--confetti-y) * 1.18 + 52px)) rotate(calc(var(--confetti-spin) + 95deg));
  }
}
[data-ticket-variant="aurora"] {
  --ticket-edge: #79dacf80;
  --ticket-surface: linear-gradient(117deg, #071314 6%, #102d41 58%, #184454);
  --foil-glint: #9efded7d;
  --foil-spectrum: #62c8f676 41%, #86fff4d1 47%, #c4ffc490 51%, #8f9bff91 57%;
  --ticket-stub-surface: linear-gradient(135deg, #e3fff8, #a7e8de 49%, #c1e5ff 75%, #d5daff);
}
[data-ticket-variant="sapphire"] {
  --ticket-edge: #94acff95;
  --ticket-surface: linear-gradient(117deg, #0e0c27 6%, #151d4d 58%, #344e83);
  --foil-glint: #a4c4ff8e;
  --foil-spectrum: #8f81f893 41%, #83bdffd1 47%, #e0f2ff95 51%, #be98f190 57%;
  --ticket-stub-surface: linear-gradient(135deg, #e9edff, #aebfff 48%, #c3e4ff 76%, #d4b5e9);
}
[data-ticket-variant="rose"] {
  --ticket-edge: #ffabc492;
  --ticket-surface: linear-gradient(117deg, #1d0b22 6%, #492043 58%, #693251);
  --foil-glint: #ffc5dc8e;
  --foil-spectrum: #e28bff8c 41%, #ff9ebbca 47%, #ffe1aa96 51%, #f786be91 57%;
  --ticket-stub-surface: linear-gradient(135deg, #fbecfc, #f1bfd8 48%, #ffd7c4 74%, #e7b9e2);
}
[data-ticket-variant="common"] {
  --pull-color: #e2e7f0;
  --ticket-edge: #b4bfd78c;
  --ticket-surface: linear-gradient(117deg, #13151e 6%, #292e3f 58%, #434a60);
  --foil-glint: #c9d3e781;
  --foil-spectrum: #9ba8c364 41%, #d7deeb99 47%, #a9bbcf96 51%, #a4a0be62 57%;
  --ticket-stub-surface: linear-gradient(135deg, #f1f3fa, #c2c9d9 49%, #e4eaf4 76%, #bec6d7);
}
[data-ticket-variant="legendary"] {
  --pull-color: #ffe3a5;
  --ticket-edge: #f4c775be;
  --ticket-surface: linear-gradient(117deg, #160e1b 6%, #38203d 58%, #573326);
  --foil-glint: #ffe1a87d;
  --foil-spectrum: #d59afb85 41%, #9ff5ebad 46%, #ffe69dc9 51%, #ff9dd090 58%;
  --ticket-stub-surface: linear-gradient(135deg, #fff2cc, #f9c991 48%, #f6dfab 72%, #e7b9df);
}
.ticket {
  --stub-width: clamp(86px, 23vw, 156px);
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--stub-width);
  transform: perspective(950px) rotateX(var(--ticket-tilt-x, 0deg)) rotateY(var(--ticket-tilt-y, 0deg));
  transition: transform 180ms ease-out;
}
.ticket-face, .ticket-stub {
  position: relative;
  min-width: 0;
  transition: transform 300ms cubic-bezier(.2, .68, .32, 1);
}
.ticket-face {
  isolation: isolate;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  gap: clamp(1.5rem, 5vw, 3rem);
  min-height: 318px;
  padding: clamp(1rem, 4vw, 2.1rem);
  border: 1px solid var(--ticket-edge, #c5a6ef72);
  border-right: 0;
  border-radius: 17px 0 0 17px;
  clip-path: var(--ticket-face-outline, none);
  text-align: left;
  background: var(--ticket-surface, linear-gradient(117deg, #0b0515 6%, #1e0d36 58%, #362057));
}
.ticket-foil {
  position: absolute;
  z-index: -1;
  inset: 0;
  background:
    radial-gradient(ellipse at var(--foil-x, 73%) var(--foil-y, 35%), var(--foil-glint, #f5a4ff65), transparent 34%),
    linear-gradient(118deg, transparent 30%, var(--foil-spectrum, #ad76f55e 41%, #8eebf5af 47%, #e1ffc37a 51%, #e7a3ff83 57%), transparent 69%),
    radial-gradient(circle, #e7cbff28 .6px, transparent .95px);
  background-size: 100% 100%, 230% 230%, 5px 5px;
  background-position: center, var(--foil-x, 73%) var(--foil-y, 35%), center;
  mix-blend-mode: screen;
  opacity: .72;
}
.ticket-emblem {
  position: absolute;
  z-index: -1;
  right: -9%;
  top: 50%;
  width: 69%;
  aspect-ratio: 1;
  transform: translateY(-50%) rotate(12deg);
  background:
    repeating-radial-gradient(circle, transparent 0 17px, #e9c0ff30 17px 18px, transparent 18px 30px),
    repeating-conic-gradient(from -1.6deg, #f4d4ffa6 0 3.2deg, transparent 3.2deg 45deg);
  mask: radial-gradient(circle, transparent 0 8%, #000 8.5%, #000 58%, transparent 73%);
}
.ticket-brand { display: flex; align-items: center; gap: 7px; }
.ticket-brand img { display: block; }
.ticket h2 {
  margin: 0;
  font-size: clamp(1.9rem, 7.5vw, 4.3rem);
  font-weight: 700;
  line-height: .9;
  letter-spacing: -.065em;
  text-shadow: 0 2px 15px #100620bf;
}
.ticket h2 span { display: block; }
.ticket h2 span + span { margin-top: .08em; }
.ticket-details { display: flex; flex-wrap: wrap; gap: .3rem 1.125rem; font-size: .9375rem; color: #f5e7ff; }
.ticket-stub {
  display: flex;
  align-items: stretch;
  padding: 0;
  border: 0;
  color: #220f3d;
  background: transparent;
  cursor: grab;
  touch-action: none;
  user-select: none;
  transform-origin: left top;
}
.ticket-stub-paper {
  position: relative;
  display: flex;
  flex: 1;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  padding: clamp(1rem, 4vw, 2.1rem) clamp(.5rem, 2vw, 1.45rem);
  border: 1px solid var(--ticket-edge, #f2d9ff);
  border-left: 0;
  border-radius: 0 17px 17px 0;
  clip-path: var(--ticket-stub-outline, none);
  text-align: left;
  background: var(--ticket-stub-surface,
    linear-gradient(135deg, #eee4ffb8, transparent 39%, #c1f7f2a6 57%, #b493ec54 76%, #ebd0ff), #dec6fc);
}
.ticket-fibres {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  fill: none;
  stroke: #e6c8ff;
  stroke-width: 1.1px;
  stroke-linecap: round;
}
.ticket-fibres-snapped { opacity: .65; }
.ticket-stub-finish {
  color: #220f3d;
  font-size: clamp(.75rem, 3.4vw, 1rem);
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
}
.ticket-stub:hover .ticket-stub-paper { filter: brightness(1.1); }
.ticket.is-pulling .ticket-stub { transition: none; cursor: grabbing; }
.ticket.is-torn .ticket-face { transform: translateX(calc(var(--stub-width) / 2)); }
.ticket.is-torn .ticket-stub { pointer-events: none; }
.ticket-stub[hidden] { display: none; }
@media (max-width: 480px) {
  .ticket-face { min-height: 240px; }
  .ticket-details { flex-direction: column; }
}
@media (max-height: 440px) {
  .reveal-dialog { max-height: calc(100% - 16px); overflow: auto; }
  .ticket-face { min-height: 0; gap: 1rem; }
}
@media (prefers-reduced-motion: reduce) {
  .opening-flash { display: none; }
  .reveal-dialog.is-launching::backdrop { animation: none; }
  .is-launching .close-reveal:not(:focus-visible) { animation: none; }
  .is-launching.has-flight-mesh .ticket-flight-canvas,
  .is-launching.has-flight-mesh .ticket-flight > .ticket { animation: none; }
  .is-launching.has-flight-mesh .ticket-flight-canvas { visibility: hidden; }
  .ticket, .ticket-face, .ticket-stub { transition: none; }
}
</style>
